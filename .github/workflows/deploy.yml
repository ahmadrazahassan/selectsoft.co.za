name: Deploy

# Lint, typecheck and the suite run on every push and always gate.
#
# The deploy step is conditional, because this repository currently has two
# ways to reach production. Cloudflare's own Git integration builds and
# deploys on push, and that is what has actually been shipping. This workflow
# can deploy too, but only once CLOUDFLARE_API_TOKEN is present. Without it
# wrangler exits non zero in about a second and turns every push red for a
# credential that was never set, which teaches everyone to ignore a red tick.
#
# To make this workflow the single deploy path: add CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID under Settings, Secrets and variables, Actions, then
# disconnect the Cloudflare Git integration so the Worker is not deployed
# twice from one push.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # NEXT_PUBLIC_* is inlined by Vite at build time, so it has to be present
      # here rather than set on the Worker afterwards.
      NEXT_PUBLIC_SITE_URL: https://selectsoft.co.za
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Lifted to the job so a step can test whether it was ever set. The
      # secrets context is not readable from a step level `if`, the env
      # context is.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # This builds first, so dist/ is the tested artifact.
      - name: Test
        run: npm test

      # A pull request is checked, never shipped.
      - name: Deploy to Cloudflare Workers
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name != 'pull_request'
        run: npx wrangler deploy -c dist/server/wrangler.json

      - name: Deploy skipped
        if: env.CLOUDFLARE_API_TOKEN == '' && github.event_name != 'pull_request'
        run: |
          echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN is not set, so this workflow did not deploy. Cloudflare's Git integration is the live deploy path. See the comment at the top of this file to switch."

      - name: Check the deploy answers
        if: steps.deploy.outcome == 'success'
        run: |
          for path in / /robots.txt /sitemap.xml /reviews/sage-accounting; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://selectsoft.co.za$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
